name: Build Goalora Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          cp index.html styles.css app.js enhancements.js navigation.js auth.js install.js manifest.webmanifest icon.svg sw.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Goalora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goalora-Android
          path: Goalora.apk

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Goalora.apk --clobber
          else
            gh release create android-latest Goalora.apk \
              --title "Goalora Android Latest" \
              --notes "Latest Android APK for Goalora. Download Goalora.apk and install it on Android."
          fi
